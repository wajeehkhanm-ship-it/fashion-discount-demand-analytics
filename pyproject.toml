[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdda"
version = "0.1.0"
description = "Discount payback, RFM/churn, demand forecasting and ML product tagging for fashion e-commerce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "kaggle>=1.8,<3",
    "six>=1.16",  # imported by some kaggle releases but not declared as their dependency
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
analysis = [
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]
forecast = [
    "prophet>=1.1.5",
]
tagging = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebooks hold chart titles/labels on one line for readability.
"*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
