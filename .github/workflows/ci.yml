name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,analysis,forecast,tagging]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (synthetic fixtures only, no Kaggle data needed)
        run: pytest
