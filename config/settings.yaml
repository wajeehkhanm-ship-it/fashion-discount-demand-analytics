# Single source of truth for paths, seeds and analysis parameters.
# Paths are relative to the repo root.

project:
  seed: 42

# Dev mode samples a fixed share of customers (H&M) / listings (Myntra) so every
# step runs in minutes. Final numbers must come from dev_mode: false.
dev_mode: true
dev_sample_fraction: 0.10

paths:
  raw: data/raw
  interim: data/interim          # cleaned Parquet goes to data/interim/<dev|full>/
  processed: data/processed
  reports: reports
  figures: reports/figures

duckdb:
  memory_limit: 4GB
  temp_directory: data/interim/_duckdb_tmp

datasets:
  hm:
    competition: h-and-m-personalized-fashion-recommendations
    # Only the tabular files; the competition's ~30 GB of images are not needed.
    files: [transactions_train.csv, articles.csv, customers.csv]
  myntra:
    dataset: ronakbokaria/myntra-products-dataset
    # Source column names (matched case-insensitively). The source "discount"
    # column mixes rupees and percent, so discount is recomputed from price/mrp.
    columns:
      id: id
      name: name
      price: price
      mrp: mrp
      rating: rating
      rating_total: ratingTotal
      seller: seller

cleaning:
  # H&M prices are normalized to ~0-1. Revenue is reported as "indexed revenue"
  # = price x this factor. It is a readability rescale, not a currency.
  price_rescale_factor: 1000
  # Flag (do not drop) H&M rows priced above this multiple of the article median.
  price_outlier_multiple: 5
  max_discount: 0.90

eda:
  sample_rows: 200000            # rows sampled for distribution plots
  top_n_groups: 8                # categories beyond this fold into "Other"
  # Myntra has no category column. Rough keyword rules on the product name,
  # first match wins (whole-word, case-insensitive). Phase 6 replaces this with LLM tags.
  myntra_category_rules:
    - {category: "Innerwear & nightwear", keywords: [bra, bras, briefs, boxers, trunks, panties, lingerie, night, nightdress, nightsuit, pyjamas, lounge, camisole, thermal, shapewear, innerwear, vest, vests, tights]}
    - {category: "Ethnic wear", keywords: [kurta, kurtas, kurti, kurtis, saree, sarees, lehenga, dupatta, salwar, sherwani, ethnic, anarkali, churidar, suit]}
    - {category: "Tops & T-shirts", keywords: [t-shirt, t-shirts, tshirt, polo, top, tops, tank, tunic, crop]}
    - {category: "Shirts", keywords: [shirt, shirts]}
    - {category: "Dresses & jumpsuits", keywords: [dress, dresses, jumpsuit, gown, playsuit]}
    - {category: "Bottoms", keywords: [jeans, trousers, pants, shorts, skirt, skirts, joggers, leggings, palazzo, palazzos, capris, chinos]}
    - {category: "Jackets & sweaters", keywords: [jacket, jackets, sweater, sweatshirt, hoodie, blazer, coat, cardigan, pullover, shrug]}
    - {category: "Footwear", keywords: [shoes, sneakers, sandals, heels, flip-flops, slippers, boots, loafers, flats, mojaris, juttis, slides]}
    - {category: "Jewellery & watches", keywords: [earrings, necklace, jewellery, ring, rings, bracelet, bangles, pendant, anklet, chain, diamond, watch, watches, smartwatch]}
    - {category: "Bags & accessories", keywords: [bag, bags, handbag, backpack, wallet, belt, cap, sunglasses, frames, socks, scarf, stole, tie, case, iphone, phone]}
    - {category: "Home", keywords: [pillow, bedsheet, bedsheets, cushion, curtain, curtains, towel, towels, blanket, quilt, comforter, dohar, mat, rug, covers, lamp, table, bath]}
    - {category: "Beauty & personal care", keywords: [lipstick, lip, serum, cream, perfume, eau, parfum, edp, attar, attars, shampoo, moisturiser, sunscreen, kajal, foundation, face, facial, deodorant, conditioner, oil, hair, nail, soap, gel, lotion, wash, masks, mask, body]}

# --- Used from Phase 3 onwards ---------------------------------------------
pricing:
  reference_price_quantile: 0.95
  reference_window_weeks: 8        # trailing window, current week included
  reference_min_obs: 5             # fewer non-outlier sales in window -> lifetime max
  discount_bands:
    edges: [0.0, 0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.90]
    labels: ["0-5%", "5-15%", "15-25%", "25-35%", "35-45%", "45-55%", "55%+"]
  margin_scenarios: [0.50, 0.60, 0.70]   # gross margin at full price (no cost data)
  central_margin: 0.60                   # headline scenario; others shown as a range

discount_analysis:
  category_level: product_group_name
  min_articles_per_category: 300   # categories smaller than this are only in "All"
  min_articles_per_band: 30        # band cells with fewer articles are left blank
  # Baseline for band indexes. "local": the same article's full-price weeks within
  # +/- baseline_window_weeks (controls for lifecycle decay: markdowns come late in an
  # article's life). "lifetime": all full-price weeks of the article (PROJECT_PLAN 4.3
  # as written; reported as a sensitivity check).
  headline_baseline: local
  baseline_window_weeks: 8
  # Article-age buckets (weeks since first sale) used as an extra fixed effect in the
  # elasticity regression, so lifecycle decay is not read as a price effect.
  age_bucket_edges: [0, 4, 8, 13, 26, 52]
  fe_tolerance: 1.0e-8             # convergence of the two-way fixed-effects demeaning
  fe_max_iter: 500

customers:
  snapshot_date: null            # null = last transaction date + 1 day
  churn_window_days: 120         # churned = no purchase in the last N days
  churn_sensitivity_days: [90, 120, 180]
  # H&M has no order id: an "order" is one customer's purchases on one day in one channel.
  top_n: 20                      # top articles / styles in the KPI tables
  discounted_threshold: 0.05     # a unit counts as "sold at a discount" at >= 5% off
  # RFM segments on recency (R) and frequency (F) scores 1-5; first match wins.
  # The grid covers all 25 R x F cells. Monetary (M) is reported per segment.
  rfm_segments:
    - {segment: "Champions",           r: [5, 5], f: [4, 5]}
    - {segment: "Loyal",               r: [3, 4], f: [4, 5]}
    - {segment: "Potential Loyalists", r: [4, 5], f: [2, 3]}
    - {segment: "New",                 r: [4, 5], f: [1, 1]}
    - {segment: "Need Attention",      r: [3, 3], f: [1, 3]}
    - {segment: "Can't Lose",          r: [1, 2], f: [5, 5]}
    - {segment: "At Risk",             r: [1, 2], f: [3, 4]}
    - {segment: "Hibernating",         r: [2, 2], f: [1, 2]}
    - {segment: "Lost",                r: [1, 1], f: [1, 2]}
  # Win-back playbook: segments covered, in priority order, with the actions that are
  # judgement calls (channel, timing, KPI). Sizes, revenue, categories, discount
  # behaviour and the capped offer are computed from data.
  winback:
    - segment: "Can't Lose"
      action: "Personal re-engagement: early access to the new season plus a capped offer"
      channel: "Email + app push, personalised by favourite category"
      timing: "Now, then 2-3 weeks before each seasonal peak"
      kpi: "Reactivation within 60 days vs a 10% holdout; incremental revenue per contact"
    - segment: "At Risk"
      action: "3-touch email series: new arrivals in favourite categories, then the offer"
      channel: "Email (online-heavy segment), store receipt message for in-store buyers"
      timing: "When recency passes 90 days; series over 3 weeks"
      kpi: "Second purchase within 45 days vs holdout"
    - segment: "Hibernating"
      action: "Low-cost content-led nudge; offer only on the last touch"
      channel: "Newsletter / owned channels only (no paid media)"
      timing: "At season launches"
      kpi: "Reactivation rate and offer cost per reactivated customer"
    - segment: "Lost"
      action: "One final reactivation message, then sunset from campaigns"
      channel: "Single email; suppress from paid retargeting"
      timing: "Once, at the next major sale event"
      kpi: "Reactivation rate; list hygiene (unsubscribes, bounces)"

forecast:
  category_level: product_group_name
  top_n_categories: 8              # by total units
  horizon_weeks: 12
  n_folds: 4                       # rolling-origin folds, non-overlapping, last 4 x 12 weeks
  season_length_weeks: 52          # seasonal-naive baseline: same week last year
  horizon_buckets: [[1, 4], [5, 8], [9, 12]]
  promo_threshold: 0.05            # promo intensity = share of units >= 5% off
  chart_history_weeks: 52
  prophet:
    yearly_seasonality: 6          # Fourier order; kept low, < 2 years of history
    seasonality_mode: multiplicative
    changepoint_prior_scale: 0.05
    interval_width: 0.80

tagging:
  # Classic ML tagger: TF-IDF text features -> XGBoost (vs logistic regression and a
  # most-frequent-label baseline), trained on H&M article labels.
  fields: [category, subcategory, primary_colour, pattern]
  text_columns: [prod_name, detail_desc]
  group_column: product_code       # colour variants share text: split by style, not article
  test_size: 0.20
  val_size: 0.10                   # share of training styles held out for model selection
  tfidf: {ngram_range: [1, 2], min_df: 3, max_features: 30000, sublinear_tf: true}
  logreg: {C: 4.0, max_iter: 2000}
  xgboost:
    n_estimators: 400
    learning_rate: 0.2
    max_depth: 6
    subsample: 0.9
    colsample_bytree: 0.5
    early_stopping_rounds: 20
    tree_method: hist
    max_features_selected: 3000    # chi2-selected TF-IDF features for the tree model
  confidence_thresholds: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
  auto_accept_threshold: 0.9       # suggestions at or above this confidence are auto-accepted
  # Fields in the combined auto-accept measure. Colour is left out: product texts rarely
  # name the colour and colour variants share one description, so it needs image data.
  auto_accept_fields: [category, subcategory, pattern]
  myntra_sample_size: 5000
  effort_study:
    n_items: 100                   # per arm (manual, review), from the H&M test set
  # Allowed values per field (labels are mapped onto these; see hm_eval below).
  schema:
    category: [Topwear, Bottomwear, Full-body garment, Innerwear, Nightwear & loungewear,
               Swimwear, Footwear, Socks & hosiery, Accessories, Other]
    subcategory: [Trousers, Dress, Sweater, T-shirt, Top, Blouse, Jacket, Shorts, Shirt, Vest top,
                  Underwear bottom, Skirt, Hoodie, Bra, Socks, Leggings/Tights, Sneakers, Cardigan,
                  Hat/beanie, Garment Set, Swimwear bottom, Bag, Earring, Jumpsuit/Playsuit, Pyjama set,
                  Blazer, Other accessories, Boots, Scarf, Bodysuit, Hair/alice band, Bikini top,
                  Sandals, Swimsuit, Sunglasses, Necklace, Cap/peaked, Underwear Tights, Coat, Belt,
                  Polo shirt, Hat/brim, Other shoe, Pyjama jumpsuit/playsuit, Ballerinas, Other]
    primary_colour: [Black, White, Grey, Beige, Brown, Blue, Green, Red, Pink, Purple, Yellow, Orange,
                     Metallic, Unknown]
    pattern: [Solid, Striped, Checked, Printed, Graphic print, Polka dot, Melange, Denim, Lace,
              Embroidered, Colour block, Textured, Embellished, Other]

  hm_eval:
    category_from_product_group:
      Garment Upper body: Topwear
      Garment Lower body: Bottomwear
      Garment Full body: Full-body garment
      Underwear: Innerwear
      Nightwear: Nightwear & loungewear
      Swimwear: Swimwear
      Shoes: Footwear
      Socks & Tights: Socks & hosiery
      Accessories: Accessories
      Bags: Accessories
    # H&M colour groups -> base colours: first keyword (case-insensitive) that appears wins.
    colour_rules:
      - [gold, Metallic]
      - [silver, Metallic]
      - [bronze, Metallic]
      - [black, Black]
      - [white, White]
      - [greyish beige, Beige]
      - [beige, Beige]
      - [grey, Grey]
      - [yellowish brown, Brown]
      - [brown, Brown]
      - [khaki, Green]
      - [turquoise, Blue]
      - [blue, Blue]
      - [green, Green]
      - [red, Red]
      - [pink, Pink]
      - [purple, Purple]
      - [yellow, Yellow]
      - [orange, Orange]
    pattern_from_appearance:
      Solid: Solid
      All over pattern: Printed
      Melange: Melange
      Stripe: Striped
      Denim: Denim
      Front print: Graphic print
      Placement print: Graphic print
      Check: Checked
      Colour blocking: Colour block
      Contrast: Colour block
      Lace: Lace
      Embroidery: Embroidered
      Jacquard: Textured
      Other structure: Textured
      Chambray: Textured
      Slub: Textured
      Mesh: Textured
      Neps: Textured
      Argyle: Textured
      Application/3D: Embellished
      Glittering/Metallic: Embellished
      Metallic: Embellished
      Sequin: Embellished
      Hologram: Embellished
      Dot: Polka dot
